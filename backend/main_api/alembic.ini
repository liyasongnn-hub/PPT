[alembic]
# Alembic 迁移仅用于 PostgreSQL。本地 SQLite 开发由应用在启动时
# 通过 Base.metadata.create_all() 自动建表，无需（也无法）跑迁移。
script_location = alembic

# 让 alembic 运行时能 import 同目录下的 db.py / models.py
prepend_sys_path = .

# URL 由 env.py 从 DATABASE_URL 环境变量读取并归一化，此处留空即可。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
