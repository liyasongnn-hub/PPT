# 创建本地的网络的方法
services:
  personaldb:
    container_name: ppt_personal_db
    build:
      context: ./backend/personaldb
      dockerfile: Dockerfile
    ports:
      - "9100:9100"
    env_file:
      - .env
    environment:
      CHROMA_DB_DIR: /data/chromadb
      PERSONALDB_CACHE_DIR: /data/cache
      PERSONALDB_TEMP_DIR: /data/temp
      PERSONALDB_CACHE_ENABLED: ${PERSONALDB_CACHE_ENABLED:-false}
      REQUIRE_INTERNAL_AUTH: ${REQUIRE_INTERNAL_AUTH:-false}
      PERSONALDB_INTERNAL_TOKEN: ${PERSONALDB_INTERNAL_TOKEN:-}
    networks:
      - main_ppt_network
    volumes:
      - ./backend/personaldb:/app
      - personaldb_data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  outline_api:
    container_name: ppt_outline_api_app
    build:
      context: ./backend/simpleOutline
      dockerfile: Dockerfile
    ports:
      - "10060:10001"
    env_file:
      - .env
    networks:
      - main_ppt_network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OUTLINE_API=http://ppt_outline_api_app:10001
    volumes:
      - ./backend/simpleOutline:/app
    command: >
      python main_api.py
      --host 0.0.0.0
      --port 10001
      --agent_url http://ppt_outline_api_app:10001/

  content_api:
    container_name: ppt_content_api_app
    build:
      context: ./backend/slide_agent
      dockerfile: Dockerfile
    ports:
      - "10061:10011"
    env_file:
      - .env
    networks:
      - main_ppt_network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CONTENT_API=http://ppt_content_api_app:10011
      - PERSONAL_DB=http://ppt_personal_db:9100
      - PERSONALDB_INTERNAL_TOKEN=${PERSONALDB_INTERNAL_TOKEN:-}
    volumes:
      - ./backend/slide_agent:/app   # 关键：本地覆盖容器/app
    command: >
      python main_api.py
      --host 0.0.0.0
      --port 10011
      --agent_url http://ppt_content_api_app:10011/

  main_api:
    container_name: ppt_main_api_app
    build:
      context: ./backend/main_api
      dockerfile: Dockerfile
    ports:
      - "6800:6800"
    env_file:
      - .env
    networks:
      - main_ppt_network
    volumes:
      - ./backend/main_api:/app
      - platform_data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OUTLINE_API=http://ppt_outline_api_app:10001
      - CONTENT_API=http://ppt_content_api_app:10011
      - PERSONAL_DB=http://ppt_personal_db:9100
      - PLATFORM_DATA_DIR=/data
      - PERSONALDB_INTERNAL_TOKEN=${PERSONALDB_INTERNAL_TOKEN:-}

  frontend:
    container_name: ppt_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8008:80"
    networks:
      - main_ppt_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - main_api

networks:
  main_ppt_network:
    name: trainpptagent-main_ppt_network
    driver: bridge

volumes:
  platform_data:
  personaldb_data:


