# TrainPPTAgent HTTPS 反向代理 + 证书接线（Let's Encrypt / certbot）。
#
# 放在服务器上：  /etc/nginx/sites-available/ppt-agent
# 由 certbot --nginx 自动签发并改写这两个 ssl_certificate 路径。
# 前置条件：
#   * 域名 hduyspptagent.xyz 的 A 记录已指向本机公网 IP（8.210.196.154）
#   * frontend 容器已监听 127.0.0.1:8008（见 docker-compose.2g2g.yml 的 APP_PORT）
#   * 首次签发前，先以 80 端口 http 反代跑起来（certbot HTTP-01 挑战需要）

server {
    listen 80;
    listen [::]:80;
    server_name hduyspptagent.xyz www.hduyspptagent.xyz;

    # Let's Encrypt HTTP-01 挑战放行（其余跳转 HTTPS）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 注：Ubuntu 24.04 的 nginx 1.24 不支持独立的 "http2 on;"（1.25.1+ 才合并进 listen）。
    # HTTP/2 在此版本通过 ALPN 自动协商，无需显式指令。
    server_name hduyspptagent.xyz www.hduyspptagent.xyz;

    # certbot 自动改写这两个路径（首次签发后生效）
    ssl_certificate     /etc/letsencrypt/live/hduyspptagent.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hduyspptagent.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 长连接 + SSE 的关键超时：读/写都放大到 1 小时，避免生成推流被 nginx 掐断
    client_max_body_size 60m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
